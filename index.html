<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Take Frame Club</title>
    <style>
        /* சினிமா டார்க் தீம் */
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #1f1f1f;
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #ff0055;
        }
        /* லோகோ டிசைன் & சைஸ் */
        .site-logo {
            height: 90px;
            width: auto;
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        nav {
            margin-top: 10px;
        }
        nav a {
            color: #fff;
            margin: 0 12px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
        }
        nav a:hover {
            color: #ff0055;
        }
        .container {
            padding: 20px;
            max-width: 1000px;
            margin: auto;
        }
        .section-title {
            color: #ff0055;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
            margin-top: 30px;
        }
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 15px;
        }
        .video-card {
            background: #1e1e1e;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }
        iframe {
            width: 100%;
            height: 180px;
            border: none;
            border-radius: 5px;
        }
        .comment-box {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }
        textarea {
            width: 98%;
            height: 70px;
            background: #2b2b2b;
            color: #fff;
            border: 1px solid #444;
            border-radius: 5px;
            padding: 8px;
        }
        button {
            background: #ff0055;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 8px;
            font-weight: bold;
        }
        button:hover {
            background: #e0004c;
        }
    </style>
</head>
<body>

    <header>
        <!-- உங்களது logo.png இமேஜ் இங்கே இணைக்கப்பட்டுள்ளது -->
        <div>
            <img src="logo.png" alt="One Take Frame Club Logo" class="site-logo">
        </div>
        <nav>
            <a href="#shortfilms">Short Films</a>
            <a href="#reviews">Public Reviews</a>
            <a href="#bts">BTS & Vlogs</a>
            <a href="#comments">Feedback</a>
        </nav>
    </header>

    <div class="container">

        <!-- 1. குறும்படங்கள் (Short Films) -->
        <h2 class="section-title" id="shortfilms">Short Films / குறும்படங்கள்</h2>
        <div class="video-grid">
            <div class="video-card">
                <h3>Our First Short Film</h3>
                <iframe src="https://www.youtube.com/embed/tgbNymZ7vqY"></iframe>
            </div>
        </div>

        <!-- 2. மக்கள் கருத்து (Public Reviews) -->
        <h2 class="section-title" id="reviews">Public Reviews / மக்கள் கருத்துக்கள்</h2>
        <div class="video-grid">
            <div class="video-card">
                <h3>Public Review #1</h3>
                <iframe src="https://www.youtube.com/embed/tgbNymZ7vqY"></iframe>
            </div>
        </div>

        <!-- 3. BTS & Vlogs -->
        <h2 class="section-title" id="bts">Making & Vlogs / பிடிஎஸ் வீடியோக்கள்</h2>
        <div class="video-grid">
            <div class="video-card">
                <h3>Shooting Vlog - Chennai & Dindigul</h3>
                <iframe src="https://www.youtube.com/embed/tgbNymZ7vqY"></iframe>
            </div>
        </div>

        <!-- 4. கருத்துகள் / ஃபீட்பேக் (Comments Section) -->
        <h2 class="section-title" id="comments">உங்கள் கருத்துக்களைப் பதியுங்கள்</h2>
        <div class="comment-box">
            <textarea placeholder="வீடியோ பற்றிய உங்கள் கருத்தை இங்கே எழுதுங்கள்..."></textarea><br>
            <button onclick="alert('நன்றி! உங்கள் கருத்து பதிவிடப்பட்டது.')">Submit Feedback</button>
        </div>

    </div>

</body>
</html>
